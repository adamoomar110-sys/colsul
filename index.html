<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colsul | Startup Aura</title>
    <link rel="icon" href="https://aura-adamo.site/assets/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .container {
            text-align: center;
            max-width: 600px;
            margin: auto;
            position: relative;
            z-index: 10;
        }
        .badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 9999px;
            color: #eab308;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 40%, #eab308 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #a1a1aa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        footer {
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #71717a;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="glow"></div>

    <div class="container">
        <div class="badge">Nuevo Proyecto en Desarrollo</div>
        <h1>COLSUL</h1>
        <p>Espacio inicial preparado y configurado en DonWeb Cloud &amp; GitHub.</p>
    </div>

    <footer>
        <p>© 2026 Aura. Todos los derechos reservados. Startup Aura por Omar Horacio Adamo.</p>
    </footer>
</body>
</html>
